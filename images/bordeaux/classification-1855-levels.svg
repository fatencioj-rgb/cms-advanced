<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="1855 classification: red wines by level">
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;text-anchor:middle}.t{fill:#fff;font-size:18px;font-weight:600}.d{fill:#3b2f2f;font-size:18px;font-weight:600}.l{fill:#5b4a4a;font-size:14px}</style>
<rect width="800" height="440" fill="#fbf7f4"/><rect x="320" y="30" width="160" height="62" rx="6" fill="#4a0f19"/><text class="t" x="400" y="57">First growths</text><text class="t" x="400" y="79" style="font-weight:400">5 châteaux</text><rect x="265" y="106" width="270" height="62" rx="6" fill="#7b1e2b"/><text class="t" x="400" y="133">Second growths</text><text class="t" x="400" y="155" style="font-weight:400">14 châteaux</text><rect x="210" y="182" width="380" height="62" rx="6" fill="#a23a48"/><text class="t" x="400" y="209">Third growths</text><text class="t" x="400" y="231" style="font-weight:400">14 châteaux</text><rect x="155" y="258" width="490" height="62" rx="6" fill="#c1636d"/><text class="t" x="400" y="285">Fourth growths</text><text class="t" x="400" y="307" style="font-weight:400">10 châteaux</text><rect x="100" y="334" width="600" height="62" rx="6" fill="#d99aa0"/><text class="d" x="400" y="361">Fifth growths</text><text class="d" x="400" y="383" style="font-weight:400">18 châteaux</text><text class="l" x="400" y="425">61 red châteaux in total (Médoc + Haut-Brion). Mouton moved from second to first growth in 1973.</text></svg>
