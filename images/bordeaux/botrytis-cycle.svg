<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="How noble rot makes Sauternes">
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;text-anchor:middle}.n{fill:#fff;font-size:26px;font-weight:700}.t{fill:#3b2f2f;font-size:17px;font-weight:700}.d{fill:#5b4a4a;font-size:13px}.f{fill:#5b4a4a;font-size:13px;font-style:italic}</style>
<rect width="900" height="470" fill="#fbf7f4"/>
<circle cx="120" cy="110" r="50" fill="#d99aa0"/><text class="n" x="120" y="119">1</text><text class="t" x="120" y="192">Perfect ripeness</text><text class="d" x="120" y="212">Grapes must be fully ripe first</text><circle cx="420" cy="110" r="50" fill="#c1636d"/><text class="n" x="420" y="119">2</text><text class="t" x="420" y="192">Morning mist</text><text class="d" x="420" y="212">From late September, from the</text><text class="d" x="420" y="228">Ciron meeting the Garonne</text><circle cx="720" cy="110" r="50" fill="#a23a48"/><text class="n" x="720" y="119">3</text><text class="t" x="720" y="192">Afternoon sun</text><text class="d" x="720" y="212">The mist clears; the fungus has</text><text class="d" x="720" y="228">time to work</text><circle cx="720" cy="300" r="50" fill="#7b1e2b"/><text class="n" x="720" y="309">4</text><text class="t" x="720" y="382">Noble rot</text><text class="d" x="720" y="402">Skin perforated, water evaporates,</text><text class="d" x="720" y="418">sugar concentrates</text><circle cx="420" cy="300" r="50" fill="#5e1722"/><text class="n" x="420" y="309">5</text><text class="t" x="420" y="382">Successive passes</text><text class="d" x="420" y="402">5 to 6 pickings, up to 9 or 10 in</text><text class="d" x="420" y="418">some years</text><circle cx="120" cy="300" r="50" fill="#4a0f19"/><text class="n" x="120" y="309">6</text><text class="t" x="120" y="382">Tiny yields</text><text class="d" x="120" y="402">10 to 15 hl/ha in the great</text><text class="d" x="120" y="418">growths</text><line x1="175" y1="110" x2="365" y2="110" stroke="#a65a62" stroke-width="3"/><polygon points="365,110 355,104 355,116" fill="#a65a62"/><line x1="475" y1="110" x2="665" y2="110" stroke="#a65a62" stroke-width="3"/><polygon points="665,110 655,104 655,116" fill="#a65a62"/><polyline points="805,110 855,110 855,300 810,300" fill="none" stroke="#a65a62" stroke-width="3"/><polygon points="800,300 812,293 812,307" fill="#a65a62"/><line x1="665" y1="300" x2="475" y2="300" stroke="#a65a62" stroke-width="3"/><polygon points="475,300 485,294 485,306" fill="#a65a62"/><line x1="365" y1="300" x2="175" y2="300" stroke="#a65a62" stroke-width="3"/><polygon points="175,300 185,294 185,306" fill="#a65a62"/><text class="f" x="450" y="455">Source: Conseil des Grands Crus Classés en 1855 (Sauternes and Barsac). Rain at the wrong moment gives grey rot instead of noble rot.</text></svg>