<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2a8c">
<meta name="robots" content="noindex, nofollow">
<title>CMS Advanced · Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261119a">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Home">
    <span class="brand-mark">CMS</span>
    <span class="brand-text"><b>Advanced</b><small>Sommelier study</small></span>
  </a>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search topics or items…" autocomplete="off">
  </label>
  <button class="icon-btn" id="menuBtn" aria-label="Data and backup" title="Backup">⋯</button>
</header>

<main id="app"></main>

<div class="sheet-overlay" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <div><h2 id="sheetTitle">Sync and backup</h2><p>Connect GitHub once on each device and my images and my own additions stay the same everywhere. Without it they stay on this device only.</p></div>
      <button class="icon-btn" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <button class="btn primary" id="exportBtn">Download backup</button>
      <label class="btn">Restore from backup<input type="file" id="importFile" accept="application/json" hidden></label>
      <div class="gh">
        <b>GitHub sync</b>
        <input id="ghRepo" placeholder="owner/repository" autocomplete="off" spellcheck="false">
        <input id="ghTok" type="password" placeholder="Access token" autocomplete="off" spellcheck="false">
        <button class="btn" id="ghSave">Connect / update</button>
        <p class="fine">The token stays in this browser only. Leave both fields empty and press the button to disconnect.</p>
      </div>
      <button class="btn danger" id="resetBtn">Clear this device</button>
      <p class="fine" id="sheetMsg"></p>
    </div>
  </div>
</div>

<script src="data.js?v=20261119a"></script>
<script src="app.js?v=20261119a"></script>
</body>
</html>
